<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>House Price Prediction</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<div class="container">


    <!-- =================================
         HEADER
    ================================== -->

    <div class="header">

        <div class="logo">
            🏠
        </div>

        <div>

            <h1>
                House Price Prediction
            </h1>

            <p>
                Machine Learning Regression System
            </p>

        </div>

    </div>


    <!-- =================================
         INPUT CARD
    ================================== -->

    <div class="card">


        <div class="section-title">

            <span>
                🏡
            </span>

            <div>

                <h2>
                    Enter House Details
                </h2>

                <p>
                    Enter the property information below
                </p>

            </div>

        </div>


        <!-- =================================
             FORM
        ================================== -->

        <form
            action="/predict"
            method="post"
        >


            <div class="form-grid">


                <!-- AREA -->

                <div class="form-group">

                    <label for="Area">
                        Area
                    </label>

                    <input
                        type="number"
                        id="Area"
                        name="Area"
                        step="any"
                        placeholder="e.g. 2500"
                        required
                    >

                </div>


                <!-- BEDROOMS -->

                <div class="form-group">

                    <label for="Bedrooms">
                        Bedrooms
                    </label>

                    <input
                        type="number"
                        id="Bedrooms"
                        name="Bedrooms"
                        min="1"
                        placeholder="e.g. 3"
                        required
                    >

                </div>


                <!-- BATHROOMS -->

                <div class="form-group">

                    <label for="Bathrooms">
                        Bathrooms
                    </label>

                    <input
                        type="number"
                        id="Bathrooms"
                        name="Bathrooms"
                        min="1"
                        placeholder="e.g. 2"
                        required
                    >

                </div>


                <!-- FLOORS -->

                <div class="form-group">

                    <label for="Floors">
                        Floors
                    </label>

                    <input
                        type="number"
                        id="Floors"
                        name="Floors"
                        min="1"
                        placeholder="e.g. 2"
                        required
                    >

                </div>


                <!-- YEAR BUILT -->

                <div class="form-group">

                    <label for="YearBuilt">
                        Year Built
                    </label>

                    <input
                        type="number"
                        id="YearBuilt"
                        name="YearBuilt"
                        min="1800"
                        max="2026"
                        placeholder="e.g. 2015"
                        required
                    >

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="Location">
                        Location
                    </label>

                    <select
                        id="Location"
                        name="Location"
                        required
                    >

                        <option value="Downtown">
                            Downtown
                        </option>

                        <option value="Suburban">
                            Suburban
                        </option>

                        <option value="Rural">
                            Rural
                        </option>

                    </select>

                </div>


                <!-- CONDITION -->

                <div class="form-group">

                    <label for="Condition">
                        Condition
                    </label>

                    <select
                        id="Condition"
                        name="Condition"
                        required
                    >

                        <option value="Good">
                            Good
                        </option>

                        <option value="Fair">
                            Fair
                        </option>

                        <option value="Poor">
                            Poor
                        </option>

                    </select>

                </div>


                <!-- GARAGE -->

                <div class="form-group">

                    <label for="Garage">
                        Garage
                    </label>

                    <select
                        id="Garage"
                        name="Garage"
                        required
                    >

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


            </div>


            <!-- =================================
                 PREDICT BUTTON
            ================================== -->

            <button
                type="submit"
                class="predict-btn"
            >

                🔮 Predict House Price

            </button>


        </form>


    </div>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        House Price Prediction
        •
        Machine Learning
        •
        FastAPI

    </footer>


</div>


</body>

</html>
